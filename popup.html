<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firefox Page Recorder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Firefox Page Recorder</p>
      <h1 id="title">Pronto para gravar</h1>
      <p id="detail" class="detail">Captura a área visível da aba ativa e salva em MP4.</p>
      <button id="toggle" class="button">Iniciar gravação</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
