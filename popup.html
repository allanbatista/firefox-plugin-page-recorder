<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firefox Page Recorder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Firefox Page Recorder</p>
      <h1 id="title">Pronto para gravar</h1>
      <p id="detail" class="detail">Captura a área visível da aba ativa e salva em WebM, com transcrição opcional em tempo real.</p>

      <section class="controls" aria-label="Configurações de gravação">
        <label class="field" for="micDevice">
          <span>Microfone (você)</span>
          <select id="micDevice"></select>
        </label>

        <label class="field" for="meetingDevice">
          <span>Áudio da reunião (loopback)</span>
          <select id="meetingDevice"></select>
        </label>

        <button id="unlockDevices" class="button secondary" hidden>
          <span>Liberar acesso ao áudio</span>
        </button>

        <label class="field" for="transcribe">
          <span>Transcrição</span>
          <select id="transcribe">
            <option value="off">Desligada</option>
            <option value="deepgram">Deepgram (tempo real)</option>
          </select>
        </label>

        <label class="field" for="deepgramKey" id="deepgramKeyField" hidden>
          <span>Chave da Deepgram</span>
          <input id="deepgramKey" type="password" autocomplete="off" spellcheck="false" placeholder="Token da API">
        </label>

        <label class="field" for="captureFps">
          <span>Frames por segundo</span>
          <select id="captureFps">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="60">60</option>
          </select>
        </label>
      </section>

      <button id="startRecording" class="button primary">
        <img class="button-icon" src="assets/icons/icon-record.svg" alt="" aria-hidden="true">
        <span id="startLabel">Iniciar gravação</span>
      </button>

      <button id="stopRecording" class="button secondary" hidden>
        <img class="button-icon" src="assets/icons/icon-pause.svg" alt="" aria-hidden="true">
        <span>Finalizar e baixar</span>
      </button>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
