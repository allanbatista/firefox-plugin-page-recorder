<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Gravando</title>
    <link rel="stylesheet" href="popup.css">
    <style>
      html,
      body {
        width: auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Firefox Page Recorder</p>
      <h1 id="title">Preparando gravação</h1>
      <p id="detail" class="detail">Aguardando a permissão de áudio.</p>

      <section id="devicePicker" class="controls" aria-label="Saída de áudio" hidden>
        <label class="field" for="audioDevice">
          <span>Saída para capturar</span>
          <select id="audioDevice"></select>
        </label>
        <button id="confirmDevice" class="button primary"><span>Continuar</span></button>
      </section>

      <button id="stop" class="button secondary" hidden>
        <img class="button-icon" src="assets/icons/icon-pause.svg" alt="" aria-hidden="true">
        <span>Finalizar e baixar WebM</span>
      </button>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="recorder.js"></script>
  </body>
</html>
