name: Build and release XPI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build XPI
        run: ./build-xpi.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-page-recorder-xpi
          path: dist/*.xpi
          if-no-files-found: error

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.xpi --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.xpi --generate-notes
          fi
